<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0E">
  <title>ข้อมูลโมเดล AI — SMS Guard AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .cm { display: grid; grid-template-columns: auto 1fr 1fr; gap: .4rem; align-items: stretch; font-size: .85rem; max-width: 24rem; }
    .cm div { padding: .6rem .5rem; border-radius: 10px; text-align: center; background: var(--surface2); border: 1px solid var(--line); }
    .cm .h { background: transparent; border: 0; color: var(--muted); font-size: .78rem; display: grid; place-items: center; }
    .cm .ok b { color: var(--safe); } .cm .bad b { color: var(--danger); }
    .cm b { display: block; font-size: 1.5rem; color: var(--ink); line-height: 1.2; }
    .ext { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: .35rem; font-size: .88rem; }
    .ext li { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem .75rem; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); border-left: 4px solid var(--safe); }
    .ext li.wrong { border-left-color: var(--danger); } .ext li.wrong b { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <div class="wrap">
      <div class="page-head">
        <span class="tile"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 9h6v6H9zM9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span>
        <div><h1>ข้อมูลโมเดล AI</h1><p>โมเดล NLP ที่ฝึกและรันด้วย Python (scikit-learn) ที่ backend</p></div>
      </div>

      <div class="kpis" id="kpis" aria-label="ผลทดสอบของโมเดลที่ใช้งานจริง"></div>
      <p class="hint" id="kpiNote" style="margin-top:.6rem"></p>

      <div class="model-grid">
        <section class="card" aria-labelledby="hC">
          <h2 id="hC"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-6M3 20h18"/></svg>เปรียบเทียบโมเดล (ชุดทดสอบ)</h2>
          <div class="scroll-x"><table class="models" id="tbl"><thead></thead><tbody></tbody></table></div>
          <h3 class="t" style="margin:1.25rem 0 .6rem;font-size:.95rem">Confusion matrix ของโมเดลที่ใช้งานจริง</h3>
          <div class="cm" id="cm"></div>
        </section>
        <section class="card" aria-labelledby="hD">
          <h2 id="hD"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>ชุดข้อมูลที่ใช้</h2>
          <div class="donut-wrap">
            <div class="donut" id="donut"><div><span><b id="dTotal">–</b><small>ข้อความไม่ซ้ำ</small></span></div></div>
            <div class="donut-legend" id="legend"></div>
          </div>
        </section>
      </div>

      <section class="card section-gap" aria-labelledby="hE">
        <h2 id="hE"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>ทดสอบกับข้อความนอกชุดข้อมูล</h2>
        <p id="extSummary" style="font-size:.92rem"></p>
        <ul class="ext" id="extList"></ul>
      </section>

      <section class="card section-gap" aria-labelledby="hN">
        <h2 id="hN"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg>หมายเหตุการอ่านผล</h2>
        <div class="notes" id="notes"></div>
      </section>
    </div>
  </main>

  <script src="js/shared.js"></script>
  <script>
    SG.mount('model');
    const $ = id => document.getElementById(id), esc = SG.escapeHtml, ic = SG.icon;
    const pct = v => (v * 100).toFixed(1) + '%';
    const NAMES = { instagram: 'รีเซ็ตรหัส Instagram', trueid: 'ซีรีส์ TrueID NOW', telegram: 'Telegram login', truenet: 'SMS เน็ตทรู', heng: 'บาคาร่า HENG88', slot: 'สล็อต PG ไหลรัว', parcel: 'พัสดุตกค้าง', loan: 'เงินกู้ด่วน', electric: 'คืนค่าไฟ/มิเตอร์', bank: 'บัญชีถูกระงับ', job: 'งานเสริมแอดไลน์', otp: 'OTP ธนาคาร', salary: 'เงินเข้าบัญชี', doctor: 'นัดพบแพทย์', chat: 'แชตในครอบครัว' };

    fetch('model/metrics.json').then(r => { if (!r.ok) throw 0; return r.json(); }).then(m => {
      const d = m.dataset, best = m.models.find(x => x.name === m.deployed) || m.models[0];
      const k = [
        ['Accuracy', best.accuracy, 'shield-check', 'f-mint', 'ถูกกี่ส่วนจากทั้งหมด'],
        ['Precision', best.precision, 'check', 'f-blue', 'ที่ทายว่ามิจฉาชีพ ถูกกี่ส่วน'],
        ['Recall', best.recall, 'search', 'f-sky', 'มิจฉาชีพจริง จับได้กี่ส่วน'],
        ['F1-score', best.f1, 'chart', 'f-rose', 'สมดุล Precision/Recall']
      ];
      $('kpis').innerHTML = k.map(x => `<div class="kpi ${x[3]}"><div class="top">${ic(x[2])}${x[0]}</div><b>${pct(x[1])}</b><small>${x[4]}</small></div>`).join('');
      $('kpiNote').textContent = `โมเดลที่ใช้งานจริง: ${best.name} · ${m.features} · ทดสอบบน ${d.n_test} ข้อความที่ไม่ใช้ฝึก · ฝึกเมื่อ ${new Date(m.trained_at).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' })}`;

      $('tbl').querySelector('thead').innerHTML = '<tr><th>โมเดล</th><th>Accuracy</th><th>Precision</th><th>Recall</th><th>F1</th><th>ROC-AUC</th><th>CV F1 (5 fold)</th></tr>';
      $('tbl').querySelector('tbody').innerHTML = m.models.map(x => `<tr><td>${esc(x.name)}${x.name === m.deployed ? ' <span class="badge ok">ใช้งานจริง</span>' : ''}</td><td>${pct(x.accuracy)}</td><td>${pct(x.precision)}</td><td>${pct(x.recall)}</td><td>${pct(x.f1)}</td><td>${x.roc_auc.toFixed(3)}</td><td>${pct(x.cv_f1_mean)} ±${(x.cv_f1_std * 100).toFixed(1)}</td></tr>`).join('');

      const [[tn, fp], [fn, tp]] = best.confusion;
      $('cm').innerHTML = `<div class="h"></div><div class="h">ทายว่าปกติ</div><div class="h">ทายว่ามิจฉาชีพ</div>
        <div class="h">จริง: ปกติ</div><div class="ok"><b>${tn}</b>ถูก</div><div class="bad"><b>${fp}</b>เตือนผิด</div>
        <div class="h">จริง: มิจฉาชีพ</div><div class="bad"><b>${fn}</b>พลาด</div><div class="ok"><b>${tp}</b>ถูก</div>`;

      $('dTotal').textContent = d.n_unique.toLocaleString('th-TH');
      $('donut').style.setProperty('--a', (d.n_scam / d.n_unique * 100) + '%');
      $('legend').innerHTML = `<div><i style="background:var(--brand)"></i>ข้อความมิจฉาชีพ ${d.n_scam} (${(d.n_scam / d.n_unique * 100).toFixed(0)}%)</div><div><i style="background:#9C9CAC"></i>ข้อความปกติ ${d.n_ham} (${(d.n_ham / d.n_unique * 100).toFixed(0)}%)</div>
        <div style="color:var(--muted);font-size:.8rem">ฝึก ${d.n_train} · ทดสอบ ${d.n_test}</div>`;

      const ex = m.external;
      if (ex && ex.n) {
        $('extSummary').innerHTML = `ข้อความ ${ex.n} ข้อความที่โมเดลไม่เคยเห็น (ไฟล์ <code>${esc(ex.file)}</code>) โมเดลทายถูก <b>${ex.n_correct}/${ex.n}</b>`;
        $('extList').innerHTML = ex.items.map(i => `<li class="${i.correct ? '' : 'wrong'}"><span>${esc(NAMES[i.id] || i.id)} <small style="color:var(--muted)">(จริง: ${i.label ? 'มิจฉาชีพ' : 'ปกติ'})</small></span><b>${Math.round(i.scam_probability * 100)}% ${i.correct ? '✓' : '✗'}</b></li>`).join('');
      } else $('extSummary').textContent = 'ไม่มีข้อมูลการทดสอบนอกชุดข้อมูล';

      const dup = d.n_duplicates;
      let notes = '';
      if (dup > 0) notes += `<div class="note info">${ic('info')}<div><b>ตัดข้อความซ้ำก่อนฝึก</b> ชุดข้อมูลเดิมมี ${d.n_raw.toLocaleString('th-TH')} รายการ แต่ซ้ำกัน ${dup.toLocaleString('th-TH')} รายการ เหลือ ${d.n_unique.toLocaleString('th-TH')} ข้อความที่ไม่ซ้ำ ผลทดสอบก่อนตัดซ้ำที่ได้ 100% จึงสูงเกินจริง</div></div>`;
      if (ex && ex.n && ex.n_correct < ex.n) notes += `<div class="note">${ic('alert')}<div><b>โมเดลยังไม่แม่นกับข้อความนอกชุดข้อมูล</b> ชุดข้อมูลมีขนาดเล็กและสร้างจากแม่แบบข้อความ ผลบนชุดทดสอบ (${pct(best.accuracy)}) จึงสูงกว่าผลจริง หน้าเว็บจึงให้ระบบกฎเป็นผลหลัก และแสดงโมเดล ML เป็นความเห็นที่สอง หากเก็บ SMS จริงเพิ่มแล้วฝึกใหม่ (<code>python train_model.py</code>) ผลจะดีขึ้น</div></div>`;
      notes += `<div class="note info">${ic('info')}<div><b>สถาปัตยกรรม</b> เบราว์เซอร์ส่งข้อความไป <code>POST /api/analyze</code> ที่ <code>server.py</code> (Python) ซึ่งโหลดโมเดลจาก <code>model/scam_model.joblib</code> แล้วคืนความน่าจะเป็น ส่วนระบบกฎและกราฟคะแนนทำงานในเบราว์เซอร์ ถ้าไม่มีเซิร์ฟเวอร์ Python เว็บยังทำงานได้ด้วยระบบกฎอย่างเดียว</div></div>`;
      $('notes').innerHTML = notes;
    }).catch(() => {
      $('kpis').innerHTML = '';
      $('notes').innerHTML = `<div class="note">${ic('alert')}<div><b>ไม่พบไฟล์ผลโมเดล</b> รัน <code>python train_model.py</code> เพื่อสร้าง <code>model/metrics.json</code> แล้วเปิดเว็บผ่านเซิร์ฟเวอร์ (<code>python server.py</code>)</div></div>`;
    });
  </script>
</body>
</html>
