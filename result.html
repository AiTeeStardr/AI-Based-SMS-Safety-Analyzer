<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0E">
  <title>ผลการวิเคราะห์ — SMS Guard AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main>
    <div class="wrap" id="root" style="padding-top:1.5rem"></div>
  </main>

  <script src="js/shared.js"></script>
  <script>
    SG.mount('result');
    const root = document.getElementById('root');
    const esc = SG.escapeHtml, ic = SG.icon;
    const id = new URLSearchParams(location.search).get('id');
    const rec = id ? SG.history.get(id) : SG.history.all()[0];

    if (!rec) {
      root.innerHTML = `<div class="card empty">${ic('search')}<h1 style="font-size:1.3rem">ยังไม่มีผลการวิเคราะห์</h1><p style="color:var(--muted)">วางข้อความหรืออัปโหลดภาพหน้าจอ แล้วผลจะแสดงที่นี่</p><a class="btn btn-primary" href="check.html">ไปตรวจสอบ SMS</a></div>`;
    } else render(rec);

    function render(r) {
      const L = r.level;
      const head = {
        danger: { icon: 'shield-alert', title: 'พบว่าเป็น SMS ' + r.category, sub: 'มีความเสี่ยงสูง ควรหลีกเลี่ยง อย่ากดลิงก์' },
        warn:   { icon: 'alert', title: 'ข้อความน่าสงสัย', sub: 'ควรตรวจสอบที่มาให้แน่ชัดก่อนกดลิงก์' },
        safe:   { icon: 'shield-check', title: 'ไม่พบสัญญาณหลอกลวง', sub: 'ข้อความนี้ดูเป็นข้อความทางการหรือการสนทนาปกติ' }
      }[L];
      const advice = {
        danger: `<h3>${ic('shield-alert')}ทำตามนี้ทันที</h3><ol><li><strong>ห้ามกดลิงก์</strong> หรือเปิดเว็บไซต์ที่แนบมา</li><li><strong>ห้ามโอนเงิน</strong> และห้ามให้เลขบัตรประชาชน เลขบัญชี หรือรหัส OTP</li><li>บล็อกเบอร์ผู้ส่งและรายงานเป็นสแปม</li><li>หากเผลอกดหรือโอนไปแล้ว โทร <strong>1441</strong> ทันที</li></ol>`,
        warn: `<h3>${ic('alert')}ก่อนทำอะไรต่อ</h3><p>โทรถามหน่วยงานหรือบุคคลต้นทางโดยตรงจากเบอร์ที่คุณมีอยู่แล้ว และยังไม่ต้องกดลิงก์ใดๆ</p>`,
        safe: `<h3>${ic('shield-check')}ข้อควรจำ</h3><p>ธนาคารและหน่วยงานรัฐไม่ส่ง SMS ขอรหัสผ่านหรือข้อมูลส่วนตัว หากมีข้อความลักษณะนั้น ให้ถือว่าเป็นมิจฉาชีพไว้ก่อน</p>`
      }[L];

      const kw = (r.keywords || []).length
        ? `<div class="kw ${L === 'safe' ? 'is-safe' : ''}">${r.keywords.map(k => `<span>${esc(k)}</span>`).join('')}</div>`
        : '<span style="color:var(--muted);font-weight:400">ไม่พบคำสำคัญเด่นชัด</span>';

      const c = r.context || {};
      const lk = c.linkAnalysis || {};
      const reasons = (r.reasons || []).length
        ? r.reasons.map(x => `<li class="${x.type}">${esc(x.text)}</li>`).join('')
        : '<li>เป็นข้อความทั่วไป ไม่พบคำล่อลวงหรือลิงก์ต้องสงสัย</li>';

      const link = r.link ? `
        <section class="card" aria-labelledby="hL">
          <h2 id="hL">${ic('search')}ตรวจปลายทางของลิงก์ <span class="badge ${r.link.isOfficial ? 'ok' : 'bad'}">${r.link.isOfficial ? 'ปลายทางเป็นของทางการ' : 'ปลายทางแปลกปลอม เสี่ยงสูง'}</span></h2>
          <p class="url-line"><span>ลิงก์ในข้อความ</span><code>${esc(r.link.raw)}</code></p>
          <p class="url-line"><span>ผู้ถือครอง</span><b>${esc(r.link.owner)}</b></p>
          <p class="url-line"><span>วัตถุประสงค์จริง</span><b>${esc(r.link.purpose)}</b></p>
        </section>` : '';

      root.innerHTML = `
        <div data-level="${L}">
          <section class="verdict" aria-labelledby="vT">
            <div class="verdict-icon">${ic(head.icon)}</div>
            <div><h1 id="vT">${esc(head.title)}</h1><p>${esc(head.sub)}</p></div>
            <div class="gauge" id="gauge"></div>
          </section>

          <div class="result-grid">
            <div class="stack">
              <section class="card" aria-labelledby="hD">
                <h2 id="hD">${ic('chart')}รายละเอียดผลวิเคราะห์</h2>
                <dl class="kv">
                  <div><dt>ประเภทข้อความ</dt><dd><span class="tag">${esc(r.category)}</span></dd></div>
                  <div><dt>${L === 'safe' ? 'สัญญาณที่พบ' : 'คำสำคัญที่พบ'}</dt><dd>${kw}</dd></div>
                  <div><dt>แอป/หน่วยงานที่อ้างถึง</dt><dd>${esc(c.appName || 'ไม่ระบุ')}${c.appCategory ? `<small>หมวดหมู่: ${esc(c.appCategory)}</small>` : ''}</dd></div>
                  <div><dt>ส่งมาเพื่ออะไร</dt><dd>${esc(c.intent || 'ไม่ระบุ')}</dd></div>
                  <div><dt>ลิงก์ตรงกับแอปจริงไหม</dt><dd>${esc(lk.text || 'ไม่พบลิงก์ในข้อความ')}</dd></div>
                  <div><dt>วิธีวิเคราะห์</dt><dd>ระบบกฎ (Rule-based) + รายชื่อโดเมนทางการ</dd></div>
                </dl>
              </section>

              <section class="card" aria-labelledby="hO">
                <h2 id="hO">${ic('message')}ข้อความต้นฉบับ <button type="button" class="btn btn-sm btn-ghost" id="copyBtn" style="margin-left:auto">${ic('copy')}คัดลอก</button></h2>
                <div class="original" id="orig"></div>
                <div class="legend"><span><i style="background:rgba(255,77,94,.3);box-shadow:inset 0 -2px 0 var(--danger)"></i>สัญญาณหลอกลวง</span><span><i style="background:rgba(61,220,151,.26);box-shadow:inset 0 -2px 0 var(--safe)"></i>สัญญาณของจริง</span></div>
              </section>
            </div>

            <div class="stack">
              <section class="card" aria-labelledby="hW">
                <h2 id="hW">${ic('chart')}คะแนนมาจากไหน</h2>
                <div class="wf" id="wf" role="img" aria-label="กราฟแสดงที่มาของคะแนนความเสี่ยง"></div>
                <div class="wf-axis" aria-hidden="true"><span></span><div><span style="left:0">0</span><span style="left:30%">30</span><span style="left:60%">60</span><span style="left:100%">100</span></div><span></span></div>
                <p class="hint">แท่งแดงเพิ่มความเสี่ยง แท่งเขียวลดความเสี่ยง แท่งลายขาวคือการปรับตามบริบทหรือลิงก์ เส้นที่ 30 คือเริ่มเฝ้าระวัง เส้นที่ 60 คือเริ่มอันตราย</p>
              </section>

              <section class="card" aria-labelledby="hR">
                <h2 id="hR">${ic('info')}เหตุผลที่ตัดสินแบบนี้</h2>
                <ul class="reasons">${reasons}</ul>
              </section>

              ${link}

              <div class="advice">${advice}</div>
              <div class="actions">
                <a class="btn btn-call" href="tel:1441">${ic('phone')}โทร 1441</a>
                <button type="button" class="btn" id="shareBtn">${ic('share')}แชร์เตือนคนใกล้ตัว</button>
                <a class="btn btn-primary" href="check.html">${ic('plus')}ตรวจข้อความใหม่</a>
              </div>
              <p class="hint">${esc(SG.fmtDate(r.ts))} · ผลนี้ประเมินจากกฎและรายชื่อโดเมนที่ระบบรู้จัก ไม่ใช่การรับรอง</p>
            </div>
          </div>
        </div>`;

      document.getElementById('orig').innerHTML = SG.renderAnnotated(r.text, r.ranges);
      SG.renderGauge(document.getElementById('gauge'), r.percent);
      SG.renderWaterfall(document.getElementById('wf'), r.percent, r.contrib || []);

      document.getElementById('copyBtn').onclick = async () => {
        try { await navigator.clipboard.writeText(r.text); SG.toast('คัดลอกข้อความแล้ว'); } catch (e) { SG.toast('คัดลอกไม่ได้ กรุณาเลือกข้อความแล้วคัดลอกเอง'); }
      };
      document.getElementById('shareBtn').onclick = async () => {
        const data = { title: 'เตือนภัยข้อความมิจฉาชีพ', text: `ตรวจพบข้อความน่าสงสัย: "${r.text.slice(0, 80)}..." (ความเสี่ยง ${r.percent}/100) ตรวจก่อนกดลิงก์ได้ที่:`, url: location.origin + location.pathname.replace('result.html', 'check.html') };
        if (navigator.share) { navigator.share(data).catch(() => {}); return; }
        try { await navigator.clipboard.writeText(data.text + ' ' + data.url); SG.toast('คัดลอกข้อความเตือนภัยแล้ว นำไปวางส่งต่อได้เลย'); } catch (e) { SG.toast('แชร์ไม่ได้บนเบราว์เซอร์นี้'); }
      };
      document.title = head.title + ' — SMS Guard AI';
    }
  </script>
</body>
</html>
